    <g fill="none" stroke="#E08A2B">
      <circle cx="256" cy="256" r="112" stroke-width="9" opacity="0.9"/>
      <circle cx="256" cy="256" r="158" stroke-width="7" opacity="0.5"/>
      <circle cx="256" cy="256" r="200" stroke-width="5" opacity="0.24"/>
    </g>
    <g fill="#E08A2B" opacity="0.9">
      <rect x="378" y="150" width="15" height="15" rx="2"/>
      <rect x="126" y="336" width="13" height="13" rx="2"/>
      <rect x="352" y="368" width="11" height="11" rx="2"/>
      <rect x="142" y="146" width="11" height="11" rx="2"/>
    </g>
    <rect x="186" y="186" width="140" height="140" rx="18" fill="#DA3524"/>
    <rect x="186" y="186" width="140" height="140" rx="18" fill="none"
          stroke="#FF8A6B" stroke-width="5" opacity="0.55"/>
    <rect x="186" y="186" width="140" height="34" rx="18" fill="#FFFFFF" opacity="0.14"/>
  </g>
